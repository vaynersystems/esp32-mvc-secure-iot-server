<html>
<head>
    <title>$title</title>   
    $doc_head
    <script>(function(){var t='light';try{t=localStorage.getItem('site-theme')||'light';}catch(e){}if(t!=='dark'&&t!=='auto')t='light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" type="text/css" href="/W/CSS/theme.css" />   
    <link rel="stylesheet" type="text/css" href="/W/CSS/style.css" />  
    <script type="text/javascript" src="/W/JS/modal.js"></script>
</head>
<body>    
    <div class="header" id="header">$header</div>
    <div class="menu">$menu</div>
    <div class="content">$content</div>
    <div class="footer">$footer</div>    
</body>
</html>
