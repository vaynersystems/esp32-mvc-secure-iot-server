; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Locked: Arduino core 2.0.17 / IDF 4.4, the last line with the OpenSSL component lib/esp32_https_server needs (7.x/8.x are Arduino 3 / IDF 5 and drop it). 6.3.1 (core 2.0.9) had older Wi-Fi that failed to get an address on some routers.
platform = espressif32@6.13.0
board = esp32dev
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder
build_type = debug
lib_deps = 
	bblanchon/ArduinoJson@^6.21.2
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	knolleary/PubSubClient@^2.8
	enjoyneering/LiquidCrystal_I2C@^1.4.0
    vaynersystems/esp32-filesystem@^0.2.1
build_flags = 
	-DHTTPS_LOGLEVEL=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_IDF_TARGET_ESP32
debug_tool = olimex-arm-usb-tiny-h
; Adds a file system download script to the "Custom" menu in the PlatformIO Project Tasks
extra_scripts = download_fs.py
custom_unpack_directory = data_downloaded	; The directory to unpack the file system to


[env:esp32s3-16mb]
; Locked: Arduino core 2.0.17 / IDF 4.4, the last line with the OpenSSL component lib/esp32_https_server needs (7.x/8.x are Arduino 3 / IDF 5 and drop it). 6.3.1 (core 2.0.9) had older Wi-Fi that failed to get an address on some routers.
platform = espressif32@6.13.0
; esp32-s3-devkitc-1-n16r8 was dropped from newer platforms; same board: 16 MB flash, OPI PSRAM
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.filesystem = spiffs
board_build.partitions = partitionss3-16MB.csv
board_build.flash_mode = qio
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder
;build_type = debug

lib_deps = 
	bblanchon/ArduinoJson@^6.21.2
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	knolleary/PubSubClient@^2.8
	enjoyneering/LiquidCrystal_I2C@^1.4.0
    vaynersystems/esp32-filesystem@^0.2.1
build_flags = 
	-DHTTPS_LOGLEVEL=0
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DCONFIG_IDF_TARGET_ESP32S3
debug_tool = olimex-arm-usb-tiny-h
; Adds a file system download script to the "Custom" menu in the PlatformIO Project Tasks
extra_scripts = download_fs.py
custom_unpack_directory = data_downloaded	

[env:esp32s3-32mb]
; Locked: Arduino core 2.0.17 / IDF 4.4, the last line with the OpenSSL component lib/esp32_https_server needs (7.x/8.x are Arduino 3 / IDF 5 and drop it). 6.3.1 (core 2.0.9) had older Wi-Fi that failed to get an address on some routers.
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder
build_type = debug
board_upload.flash_size = 32MB
; app slot size in partitionss3-32MB.csv (4 MB)
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = opi_opi
board_build.filesystem = spiffs
; 2 x 4 MB app + 15 MB SPIFFS (SPIFFS cannot exceed 16 MB). default_16MB.csv used only the
; first 16 MB and gave SPIFFS 3.4 MB.
board_build.partitions = partitionss3-32MB.csv
build_flags = 
	-DHTTPS_LOGLEVEL=0
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_IDF_TARGET_ESP32S3
     -mfix-esp32-psram-cache-issue
debug_tool = olimex-arm-usb-tiny-h

lib_deps = 
	bblanchon/ArduinoJson@^6.21.2
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	knolleary/PubSubClient@^2.8
	enjoyneering/LiquidCrystal_I2C@^1.4.0
    vaynersystems/esp32-filesystem@^0.2.1
